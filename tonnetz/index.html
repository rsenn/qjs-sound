<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chordloom">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Chordloom</title>
<style>
:root { --bg: #07080d; --fg: #d8def0; --dim: #6b7391; --panel: #141726; --edge: #2a2f4a; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.35 system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.bar { position: fixed; top: calc(8px + env(safe-area-inset-top)); display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
#add { left: 8px; max-width: 46%; }
#ctl { right: 8px; justify-content: flex-end; max-width: 52%; }
button { background: var(--panel); color: var(--fg); border: 1px solid var(--edge); border-radius: 999px; padding: 6px 10px; font: 13px system-ui, sans-serif; cursor: pointer; touch-action: manipulation; }
button:active { background: #232842; }
button.off { opacity: .45; }
#pre, #mod { position: relative; }
#modpanel { left: 0; right: auto; width: 180px; }
.swatch { width: 10px; height: 10px; border-radius: 50%; align-self: center; flex: none; }
#prepanel, #modpanel { position: absolute; top: calc(100% + 6px); right: 0; width: 250px; max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 6px; z-index: 5; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
#prepanel[hidden], #modpanel[hidden] { display: none; }
.prow { display: flex; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.prow:hover { background: #1c2036; }
.prow.cur { background: #232842; }
.prow b { min-width: 2.4em; font-weight: 400; color: var(--dim); font-variant-numeric: tabular-nums; }
.prow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pempty { padding: 8px; color: var(--dim); }
.pedit { display: flex; gap: 5px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--edge); }
#prename { flex: 1; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid var(--edge); border-radius: 999px; padding: 5px 10px; font: 13px system-ui, sans-serif; -webkit-user-select: text; user-select: text; }
.grp { display: flex; gap: 5px; align-items: center; }
.grp + .grp { margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--edge); }
.grp:not(:has(> :not([style*="display: none"]))) { display: none; }
.step { display: flex; align-items: center; }
.step button { padding: 6px 9px; }
.step button:first-child { border-radius: 999px 0 0 999px; }
.step button:last-child { border-radius: 0 999px 999px 0; }
.step .val { min-width: 4.6em; border-block: 1px solid var(--edge); align-self: stretch; display: flex; align-items: center; justify-content: center; background: var(--panel); }
.val { min-width: 3.6em; text-align: center; color: var(--dim); font-size: 13px; }
#start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(7, 8, 13, .92); text-align: center; cursor: pointer; z-index: 10; }
#start > div { max-width: 22em; font-size: 13px; padding: 0 24px; }
#start h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: .04em; }
#start p { color: var(--dim); margin: 6px 0; }
#start b { display: inline-block; margin-top: 18px; padding: 10px 22px; border: 1px solid var(--edge); border-radius: 999px; background: var(--panel); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="add" class="bar">
  <div id="mod">
    <button id="modbtn">+ Module &#9662;</button>
    <div id="modpanel" hidden><div id="modlist"></div></div>
  </div>
  <button id="fit">Fit</button>
  <button id="tseq">Sequencer</button>
  <button id="tkeys" class="off">Piano</button>
  <button id="tton">Tonnetz</button>
  <button id="tside" title="Dock the tonnetz below or to the right">Dock: bottom</button>
</div>
<div id="ctl" class="bar">
  <div id="pre">
    <button id="prebtn">Preset: - &#9662;</button>
    <div id="prepanel" hidden>
      <div id="prelist"></div>
      <div class="pedit"><input id="prename" placeholder="preset name" maxlength="32"><button id="presave">Save</button><button id="predel">Delete</button></div>
    </div>
  </div>
  <div class="grp">
    <button id="mode">Mode: auto</button>
    <button id="play">Pause</button>
    <button id="engine">Engine: steps</button>
  </div>
  <div class="grp">
    <button id="style">Style: auto</button>
    <button id="blues">Blues riff</button>
    <button id="song">Song</button>
    <button id="songoff" style="display:none">Free walk</button>
    <button id="len">Chord: 2 bars</button>
  </div>
  <div class="grp">
    <div class="step" id="bpmg"><button id="bpmd">-</button><span id="bpmv" class="val"></span><button id="bpmu">+</button></div>
    <div class="step"><button id="octd">-</button><span id="octv" class="val"></span><button id="octu">+</button></div>
  </div>
  <div class="grp">
    <button id="root">Root: C</button>
    <button id="scale">Scale: free</button>
  </div>
</div>
<div id="start">
  <div>
    <h1>CHORDLOOM</h1>
    <p>Touch a triangle to play a chord, then let the engine carry on.</p>
    <p>Tap a module, then another, to patch. Rings are knobs.</p>
    <p>Keys ZXCVBNM / QWERTYU play notes. Space pauses.</p>
    <p>Presets, Scale lock and Engine (steps or arp) are up top.</p>
    <b>Touch to start</b>
  </div>
</div>
<script type="module">
import { NOTES, MODES, STYLES, STEPS, SCALES, KEYS, clamp, mod12, cname, cid } from './lib/theory.js';
import { Rack, TYPES } from './lib/synth.js';
import { Player } from './lib/player.js';
import { stockPresets } from './lib/presets.js';
import { fillBluesImprov } from './lib/improv.js';
import { generateSong, songToChords } from './lib/song.js';
import { ARP_STYLES } from './lib/arp.js';
import { createStore } from './app/store.js';
import { app } from './app/state.js';
import { A0, BLACK_KEYS, ROOT_NAMES, SCALE_OPTS, SPAN, SPL, U, WHITE_OFFS, Z_MAX, Z_MIN, outerR, stripH } from './app/consts.js';
import { drawArp } from './app/draw-arp.js';
import { drawKeys } from './app/draw-keys.js';
import { drawSeq } from './app/draw-seq.js';
import { drawStrip, statusText } from './app/draw-strip.js';
import { analyse, drawCable, drawGrid, drawMaster, drawModule } from './app/draw-table.js';
import { buildCache, drawTonnetz } from './app/draw-tonnetz.js';
import { direct, handleAt, keysGeo, seqGeo, sideOn } from './app/geom.js';

const cv = document.getElementById('cv');
app.g = cv.getContext('2d');
app.makeCanvas = () => document.createElement('canvas');
const $ = id => document.getElementById(id);

function refreshHintTris() {
  app.hintTris = [];
  if (!app.geo.width || direct()) return;
  app.harmony.hints.forEach((h, rank) => {
    for (const c of app.geo.copiesOf(h.id)) app.hintTris.push({ ...c, rank, name: (h.back ? '↩' : '') + cname(h.id) });
  });
}

app.onHarmonyChange = refreshHintTris;

/* ---------- modules ---------- */

const toWorld = p => ({ x: (p.x - app.view.x) / app.view.z, y: (p.y - app.view.y) / app.view.z });

function zoomAt(sx, sy, z) {
  const w = toWorld({ x: sx, y: sy });
  app.view.z = clamp(z, Z_MIN, Z_MAX);
  app.view.x = sx - w.x * app.view.z; app.view.y = sy - w.y * app.view.z;
}

/* Sized so the default patch fills the table the way it did before the view could move. */
function defaultView() {
  app.view.z = clamp(Math.min(app.LW / 13, (app.tableH - 30) / 7.6), 20, 44) / U;
  app.view.x = app.view.y = 0;
}

function fitView() {
  const items = [...app.mods, app.master];
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const m of items) {
    const isMod = m !== app.master, r = isMod ? outerR(m) : U * 1.9;
    x0 = Math.min(x0, m.x - r); x1 = Math.max(x1, m.x + r);
    y0 = Math.min(y0, m.y - r - (isMod ? U * 0.9 : 0)); y1 = Math.max(y1, m.y + r + (isMod ? U * 2 : U * 1.5));
  }
  const z = clamp(Math.min(app.LW / (x1 - x0 + U), app.tableH / (y1 - y0 + U)), Z_MIN, 1.6);
  app.view.z = z;
  app.view.x = app.LW / 2 - (x0 + x1) / 2 * z; app.view.y = app.tableH / 2 - (y0 + y1) / 2 * z;
}

function addModule(type, x, y) {
  const m = app.rack.makeModule(type, x, y);
  if (type === 'pad' && app.player.seq.running) app.rack.padSet(m, app.harmony.padVoicing());
  return m;
}

function removeModule(m) {
  app.rack.removeModule(m);
  if (app.selected === m) app.selected = null;
}

/* ---------- layout ---------- */

const minTable = () => clamp(app.H * 0.35, 120, 240);

/* When the panes don't fit, the lower ones give up height first, but never below their minimum. */
function fitPanes() {
  const vis = app.paneList.filter(p => p.show);
  let over = vis.reduce((a, p) => a + Math.max(p.h, p.min) + SPL, 0) - (app.H - stripH - minTable());
  for (const p of vis) {
    p.h = Math.max(p.h, p.min);
    const cut = clamp(over, 0, p.h - p.min);
    p.h -= cut; over -= cut;
  }
}

function relayout() {
  const side = sideOn();
  app.panes.ton.w = clamp(app.panes.ton.w, 160, Math.max(160, app.W - 300));
  app.LW = side ? app.W - app.panes.ton.w - SPL : app.W;
  $('ctl').style.right = side ? app.panes.ton.w + SPL + 8 + 'px' : '';
  $('ctl').style.maxWidth = side ? Math.round(app.LW * 0.55) + 'px' : '';
  $('add').style.maxWidth = side ? Math.round(app.LW * 0.42) + 'px' : '';
  app.paneList = [app.panes.seq, app.panes.arp, app.panes.keys, ...(side ? [] : [app.panes.ton])];
  fitPanes();
  app.tableH = app.H - stripH - app.paneList.reduce((a, p) => a + (p.show ? SPL + p.h : 0), 0);
  let y = app.tableH + stripH;
  for (const p of app.paneList) {
    if (p.show) { p.split = y; p.top = y + SPL; y = p.top + p.h; } else p.split = p.top = app.H;
  }
  if (side) {
    app.panes.ton.split = app.panes.ton.top = app.H;
    app.tonS = clamp(Math.min(app.H / 5, app.panes.ton.w / 3.5), 20, 140);
    app.geo.layout(app.H, app.tonS, (app.panes.ton.w - 3.35 * app.tonS) / 2, { x: app.LW + SPL, y: 0 });
  } else {
    app.tonS = clamp(Math.min(app.W / 5, app.panes.ton.h / 3.35), 20, app.W / 5);
    app.geo.layout(app.W, app.tonS, app.panes.ton.top + (app.panes.ton.h - 3.35 * app.tonS) / 2);
  }
  refreshHintTris();
  buildCache();
}

function resize() {
  const oh = app.H;
  app.W = innerWidth; app.H = innerHeight; app.DPR = Math.min(devicePixelRatio || 1, 1.5);
  cv.width = app.W * app.DPR; cv.height = app.H * app.DPR;
  if (oh) for (const p of app.paneList) p.h = Math.round(p.h * app.H / oh);
  else {
    app.panes.seq.h = app.panes.arp.h = clamp(Math.round(app.H * 0.24), 110, 220);
    app.panes.keys.h = clamp(Math.round(app.H * 0.15), 90, 150);
    app.panes.ton.w = clamp(Math.round(app.W * 0.28), 200, 360);
    app.panes.ton.h = Math.round(Math.min(app.W / 8, app.H * 0.4 / 3.35) * 3.35);
  }
  relayout();
  if (!oh) defaultView();
}

/* Black keys overlap the white ones, so they get first claim on the upper part of the keyboard. */
const keysMidiAt = p => {
  const K = keysGeo(), o = clamp(Math.floor(p.x / (7 * K.ww)), 0, K.oct - 1), xi = p.x - o * 7 * K.ww;
  if (p.y - K.top < K.bh) {
    for (const [pc, wi] of BLACK_KEYS) if (Math.abs(xi - wi * K.ww) < K.ww * 0.3) return K.base + 12 * o + pc;
  }
  return K.base + 12 * o + WHITE_OFFS[clamp(Math.floor(xi / K.ww), 0, 6)];
};

/* Notes from the piano and the computer keyboard are snapped to the locked scale, the same as everything else the player sounds. */
function startNote(midi, sliding) {
  const m = app.harmony.snapMidi(midi), entry = { midi: m, t0: performance.now(), t1: null };
  app.player.noteOn(m, sliding);
  app.trail.push(entry);
  return entry;
}

function endNote(entry) { if (entry) entry.t1 = performance.now(); }

/* Physical key positions, so QWERTY and QWERTZ layouts play the same notes: two rows, the number/home rows above them for sharps. */
const KEY_NOTES = (() => {
  const map = {};
  const put = (codes, base, semis) => codes.forEach((c, i) => { if (c) map[c] = base + semis[i]; });
  const white = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16];
  put(['KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB', 'KeyN', 'KeyM', 'Comma', 'Period', 'Slash'], 12, white);
  put(['KeyS', 'KeyD', null, 'KeyG', 'KeyH', 'KeyJ', null, 'KeyL', 'Semicolon'], 12, [1, 3, 0, 6, 8, 10, 0, 13, 15]);
  put(['KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyT', 'KeyY', 'KeyU', 'KeyI', 'KeyO', 'KeyP'], 24, white);
  put(['Digit2', 'Digit3', null, 'Digit5', 'Digit6', 'Digit7', null, 'Digit9', 'Digit0'], 24, [1, 3, 0, 6, 8, 10, 0, 13, 15]);
  return map;
})();

const splitAt = p => p.x < app.LW && app.paneList.find(q => q.show && p.y >= q.split - 4 && p.y < q.top + 4);
const sideSplitAt = p => sideOn() && p.x >= app.LW - 4 && p.x < app.LW + SPL + 4;

/* Dragging a splitter moves the boundary above its pane: the pane above (or the table) gives or takes the difference. */
function dragSplit(s, p) {
  const want = s.y0 - p.y, room = s.prev ? s.prev.h0 - s.prev.min : s.table0 - minTable();
  /* Once the space above is used up, growing takes from the pane below instead of stalling. */
  const fromAbove = clamp(want, 0, room);
  const fromBelow = s.next ? clamp(want - fromAbove, 0, s.next.h0 - s.next.min) : 0;
  const d = want < 0 ? Math.max(want, s.pane.min - s.pane.h0) : fromAbove + fromBelow;
  s.pane.h = s.pane.h0 + d;
  if (s.prev) s.prev.h = s.prev.h0 - (want < 0 ? d : fromAbove);
  if (s.next) s.next.h = s.next.h0 - fromBelow;
  app.layoutDirty = true;
}

/* Direct mode plays no pattern, so the sequencer hides itself there and returns with the user's own choice on going back to auto. */
const arpMode = () => !!app.player && app.player.seq.mode === 'arp';

/* The arpeggiator pane takes the sequencer grid's place while the engine is in arp mode; both share one show/hide choice. */
function applyPanes() {
  const engine = app.panes.seq.want && !direct();
  app.panes.seq.show = engine && !arpMode();
  app.panes.arp.show = engine && arpMode();
  app.panes.keys.show = app.panes.keys.want;
  app.panes.ton.show = app.panes.ton.want;
  for (const [id, btn] of [['seq', 'tseq'], ['keys', 'tkeys'], ['ton', 'tton']]) $(btn).classList.toggle('off', !(id === 'seq' ? engine : app.panes[id].show));
  $('tseq').textContent = arpMode() ? 'Arpeggiator' : 'Sequencer';
  app.layoutDirty = true;
}

function togglePane(p) {
  p.want = !p.want;
  applyPanes();
}

/* ---------- input ---------- */

const pos = e => ({ x: e.clientX, y: e.clientY });

/* The module whose centre is closest wins, so overlapping rings of neighbours never steal a touch from the nearer one. */
function hitModule(p) {
  let best = null, bd = Infinity;
  for (const m of app.mods) {
    const d = Math.hypot(p.x - m.x, p.y - m.y);
    let zone = -1;
    if (d >= U) {
      zone = Math.floor((d - U) / (U * 0.5));
      if (zone >= TYPES[m.type].params.length) continue;
    }
    if (d <= bd) { bd = d; best = { m, zone }; }
  }
  return best;
}

/* The knob follows the finger's angle directly. In the gap at the bottom of the arc the value holds the end it came from,
   so a sweep can never wrap from max to min. */
function setRing(s, p) {
  const dx = p.x - s.m.x, dy = p.y - s.m.y;
  if (Math.hypot(dx, dy) < U * 0.5) return;
  let t = ((Math.atan2(dy, dx) - A0) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) / SPAN;
  if (t > 1) t = s.m.p[s.key] > 0.5 ? 1 : 0;
  s.m.p[s.key] = t;
  app.rack.apply(s.m);
}

function hitHandle(p) {
  for (const m of app.mods) {
    if (!m.target) continue;
    const h = handleAt(m);
    if (Math.hypot(p.x - h.x, p.y - h.y) < U * 0.5) return m;
  }
  return null;
}

function tapModule(m) {
  const now = performance.now();
  if (app.lastTap.m === m && now - app.lastTap.t < 350) { removeModule(m); app.lastTap = { t: 0, m: null }; return; }
  app.lastTap = { t: now, m };
  if (app.selected && app.selected !== m && !app.selected.target && app.rack.canConnect(app.selected, m)) {
    app.rack.connect(app.selected, m);
    app.selected = null;
  } else {
    app.selected = app.selected === m ? null : m;
  }
}

cv.addEventListener('pointerdown', e => {
  if (!app.ctx) return;
  if (app.ctx.state !== 'running') app.ctx.resume();
  const p = pos(e);
  cv.setPointerCapture(e.pointerId);
  if (sideSplitAt(p)) {
    app.ptr.set(e.pointerId, { kind: 'vsplit', x0: p.x, w0: app.panes.ton.w });
    return;
  }
  const sp = splitAt(p);
  if (sp) {
    for (const q of app.paneList) q.h0 = q.h;
    const prev = app.paneList.slice(0, app.paneList.indexOf(sp)).reverse().find(q => q.show) || null;
    const next = app.paneList.slice(app.paneList.indexOf(sp) + 1).find(q => q.show) || null;
    app.ptr.set(e.pointerId, { kind: 'split', pane: sp, prev, next, y0: p.y, table0: app.tableH });
    return;
  }
  if (sideOn() ? p.x >= app.LW + SPL : app.panes.ton.show && p.y >= app.panes.ton.top) {
    app.ptr.set(e.pointerId, { kind: 'ton' });
    app.player.press(app.geo.hit(p));
    if (app.player.live) app.pulse = 1;
    return;
  }
  if (app.panes.keys.show && p.y >= app.panes.keys.top) {
    const s = { kind: 'keys', midi: keysMidiAt(p) };
    s.entry = startNote(s.midi, false);
    app.ptr.set(e.pointerId, s);
    return;
  }
  if (app.panes.arp.show && p.y >= app.panes.arp.top) {
    const hit = app.arpHits.find(h => p.x >= h.x && p.x < h.x + h.w && p.y >= h.y && p.y < h.y + h.h);
    if (hit) hit.action();
    return;
  }
  if (app.panes.seq.show && p.y >= app.panes.seq.top) {
    const S = seqGeo(), col = Math.floor((p.x - S.x0) / S.cw), area = seqArea(p, S);
    if (col < 0 || col >= STEPS || !area) return;
    const st = app.player.seq.pattern[col], s = { kind: 'seq', area, col };
    if (area === 'grid') {
      const deg = clamp(7 - Math.floor((p.y - S.gy0) / S.rh), 0, 7);
      s.mode = !st.rest && st.deg === deg ? 'erase' : 'note';
    } else {
      s.val = !st[area];
    }
    app.ptr.set(e.pointerId, s);
    paintStep(s, col, p);
    syncStyle();
    return;
  }
  if (p.y >= app.tableH) return;
  const wp = toWorld(p);
  const cable = hitHandle(wp);
  if (cable) { app.rack.disconnect(cable); return; }
  const hit = hitModule(wp);
  if (!hit) {
    if (Math.hypot(wp.x - app.master.x, wp.y - app.master.y) < U * 1.5) {
      if (app.selected && !app.selected.target) { app.rack.connect(app.selected, app.master); app.selected = null; }
      return;
    }
    app.ptr.set(e.pointerId, { kind: 'pan', x: p.x, y: p.y, t0: performance.now(), moved: false });
    beginGesture();
    return;
  }
  const { m, zone } = hit;
  app.mods.splice(app.mods.indexOf(m), 1); app.mods.push(m);
  if (zone < 0) {
    app.ptr.set(e.pointerId, { kind: 'move', m, dx: m.x - wp.x, dy: m.y - wp.y, x0: p.x, y0: p.y, t0: performance.now(), moved: false });
  } else {
    const s = { kind: 'ring', m, key: zone };
    app.ptr.set(e.pointerId, s);
    setRing(s, wp);
  }
});

const panPointers = () => [...app.ptr.values()].filter(s => s.kind === 'pan');

/* One finger on the background pans; a second one turns it into a pinch that zooms about the midpoint. */
function beginGesture() {
  const ps = panPointers();
  for (const s of ps) { s.ox = s.x; s.oy = s.y; s.vx = app.view.x; s.vy = app.view.y; }
  if (ps.length !== 2) { app.pinch = null; return; }
  const [a, b] = ps;
  app.pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: app.view.z, w: toWorld({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }) };
  a.moved = b.moved = true;
}

function moveGesture(s, p) {
  s.x = p.x; s.y = p.y;
  const ps = panPointers();
  if (ps.length === 2 && app.pinch) {
    const [a, b] = ps, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    app.view.z = clamp(app.pinch.z0 * Math.hypot(a.x - b.x, a.y - b.y) / app.pinch.d0, Z_MIN, Z_MAX);
    app.view.x = mx - app.pinch.w.x * app.view.z; app.view.y = my - app.pinch.w.y * app.view.z;
  } else {
    if (Math.hypot(s.x - s.ox, s.y - s.oy) > 6) s.moved = true;
    app.view.x = s.vx + s.x - s.ox; app.view.y = s.vy + s.y - s.oy;
  }
}

cv.addEventListener('wheel', e => {
  const p = pos(e);
  if (p.y >= app.tableH || p.x >= app.LW) return;
  e.preventDefault();
  zoomAt(p.x, p.y, app.view.z * Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

function seqArea(p, S) {
  if (p.y >= S.sy) return 'slide';
  if (p.y >= S.ay) return 'accent';
  if (p.y >= S.gy0 && p.y < S.gy0 + 8 * S.rh) return 'grid';
  return null;
}

function paintStep(s, col, p) {
  const S = seqGeo(), seq = app.player.seq;
  if (s.area !== 'grid') seq.edit(col, { [s.area]: s.val });
  else if (s.mode === 'erase') seq.edit(col, { rest: true });
  else seq.edit(col, { deg: clamp(7 - Math.floor((p.y - S.gy0) / S.rh), 0, 7), rest: false });
}

cv.addEventListener('pointermove', e => {
  const s = app.ptr.get(e.pointerId);
  if (!s) { cv.style.cursor = sideSplitAt(pos(e)) ? 'col-resize' : splitAt(pos(e)) ? 'row-resize' : ''; return; }
  const p = pos(e);
  if (s.kind === 'vsplit') {
    app.panes.ton.w = s.w0 + s.x0 - p.x;
    app.layoutDirty = true;
  } else if (s.kind === 'split') {
    dragSplit(s, p);
  } else if (s.kind === 'keys') {
    const m = app.harmony.snapMidi(keysMidiAt(p));
    if (m !== s.entry.midi) { endNote(s.entry); s.entry = startNote(m, true); }
  } else if (s.kind === 'seq') {
    const S = seqGeo(), col = clamp(Math.floor((p.x - S.x0) / S.cw), 0, STEPS - 1), dir = col >= s.col ? 1 : -1;
    for (let c = s.col + dir; dir > 0 ? c <= col : c >= col; c += dir) paintStep(s, c, p);
    if (col === s.col) paintStep(s, col, p);
    s.col = col;
  } else if (s.kind === 'ton') {
    const before = app.harmony.sel.key;
    app.player.slide(app.geo.hit(p));
    if (app.player.live && app.harmony.sel.key !== before) app.pulse = 1;
  } else if (s.kind === 'pan') {
    moveGesture(s, p);
  } else if (s.kind === 'move') {
    if (Math.hypot(p.x - s.x0, p.y - s.y0) > 8) s.moved = true;
    const wp = toWorld(p);
    s.m.x = wp.x + s.dx; s.m.y = wp.y + s.dy;
  } else {
    setRing(s, toWorld(p));
  }
});

const tonTouches = () => [...app.ptr.values()].filter(s => s.kind === 'ton').length;

function release(e) {
  if (app.ctx && app.ctx.state !== 'running') app.ctx.resume();
  const s = app.ptr.get(e.pointerId);
  if (!s) return;
  app.ptr.delete(e.pointerId);
  if (s.kind === 'ton') app.player.lift(tonTouches());
  else if (s.kind === 'keys') { endNote(s.entry); noteOffIfIdle(); }
  else if (s.kind === 'pan') {
    beginGesture();
    if (!s.moved && performance.now() - s.t0 < 300) {
      app.selected = null;
      const now = performance.now();
      if (now - app.lastBgTap < 350) fitView();
      app.lastBgTap = now;
    }
  }
  else if (s.kind === 'move' && !s.moved && performance.now() - s.t0 < 300) tapModule(s.m);
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => {
  app.ptr.clear();
  if (!app.player) return;
  app.player.lift(0);
  for (const k of app.keysDown.values()) endNote(k);
  app.keysDown.clear();
  app.player.noteOff();
});

const HIDDEN_IN_DIRECT = ['play', 'engine', 'style', 'blues', 'song', 'len', 'bpmg', 'tseq'];
function syncButtons() {
  $('play').textContent = app.player && app.player.paused ? 'Play' : 'Pause';
  $('mode').textContent = 'Mode: ' + (direct() ? 'direct' : 'auto');
  for (const id of HIDDEN_IN_DIRECT) $(id).style.display = direct() ? 'none' : '';
  if (arpMode()) for (const id of ['style', 'blues']) $(id).style.display = 'none';
  $('songoff').style.display = app.harmony.song && !direct() ? '' : 'none';
  applyPanes();
}

function syncStyle() {
  if (app.player) $('style').textContent = 'Style: ' + (app.player.seq.edited ? 'custom' : app.player.seq.styleSel);
}

const togglePause = () => { if (!app.player || direct()) return; app.player.setPaused(!app.player.paused); syncButtons(); };

/* Preventing keyup too stops a focused button from also firing its own click on space. */
const noteOffIfIdle = () => {
  if (!app.keysDown.size && ![...app.ptr.values()].some(s => s.kind === 'keys')) app.player.noteOff();
};

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) togglePause();
    return;
  }
  const note = KEY_NOTES[e.code];
  if (note === undefined || !app.player || e.ctrlKey || e.metaKey || e.altKey) return;
  e.preventDefault();
  if (e.repeat || app.keysDown.has(e.code)) return;
  if (app.ctx.state !== 'running') app.ctx.resume();
  app.keysDown.set(e.code, startNote(12 * (app.harmony.octave + 1) + note, app.keysDown.size > 0));
});
addEventListener('keyup', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') e.preventDefault();
  if (!app.keysDown.has(e.code)) return;
  endNote(app.keysDown.get(e.code));
  app.keysDown.delete(e.code);
  noteOffIfIdle();
});

const setOctave = o => {
  app.harmony.octave = clamp(o, 0, 5);
  $('octv').textContent = 'oct ' + app.harmony.octave;
  if (app.ctx) app.harmony.recompute();
};
const setBpm = b => {
  const v = clamp(b, 60, 200);
  if (app.player) app.player.seq.bpm = v;
  $('bpmv').textContent = v + ' bpm';
};
const STYLE_OPTS = ['auto', ...STYLES], LEN_OPTS = [1, 2, 4];
$('octd').onclick = () => setOctave(app.harmony.octave - 1);
$('octu').onclick = () => setOctave(app.harmony.octave + 1);
$('bpmd').onclick = () => app.player && setBpm(app.player.seq.bpm - 4);
$('bpmu').onclick = () => app.player && setBpm(app.player.seq.bpm + 4);
$('play').onclick = togglePause;
$('mode').onclick = () => {
  if (!app.player) return;
  app.player.setMode(direct() ? 'auto' : 'direct');
  syncButtons();
  refreshHintTris();
};
$('style').onclick = () => {
  if (!app.player) return;
  const seq = app.player.seq;
  seq.setStyle(STYLE_OPTS[(STYLE_OPTS.indexOf(seq.styleSel) + 1) % STYLE_OPTS.length]);
  syncStyle();
};
/* Every press deals a new riff; it keeps the scale root if one is locked, else it takes the current chord's root. */
$('engine').onclick = () => {
  if (!app.player) return;
  app.player.seq.setMode(arpMode() ? 'steps' : 'arp');
  syncSeqUi();
  syncButtons();
};

/* Every press deals a new arrangement in the current key and plays it from the top, one chord per bar. */
$('song').onclick = () => {
  if (!app.player) return;
  const tonic = app.harmony.lock ? app.harmony.lock.root : app.harmony.sel.root;
  app.harmony.setSong(songToChords(generateSong({ seed: (Math.random() * 0x7fffffff) | 0, bars: 16 }), tonic));
  app.player.seq.barsInChord = 0;
  syncButtons();
};
$('songoff').onclick = () => { app.harmony.setSong(null); syncButtons(); };

$('blues').onclick = () => {
  if (!app.player) return;
  const root = app.harmony.lock ? app.harmony.lock.root : app.harmony.sel.root;
  fillBluesImprov(app.player.seq, app.harmony, { root, seed: (Math.random() * 0x7fffffff) | 0 });
  app.scaleIdx = SCALE_OPTS.findIndex(s => s && s.name === 'blues');
  app.scaleRoot = root;
  applyScale();
  syncSeqUi();
};
$('fit').onclick =() => { if (app.master) fitView(); };
$('tseq').onclick = () => togglePane(app.panes.seq);
$('tkeys').onclick = () => togglePane(app.panes.keys);
$('tton').onclick = () => togglePane(app.panes.ton);
$('tside').onclick = () => {
  app.panes.ton.side = !app.panes.ton.side;
  $('tside').textContent = 'Dock: ' + (app.panes.ton.side ? 'right' : 'bottom');
  try { localStorage.setItem('tonnetz.dock', app.panes.ton.side ? 'right' : 'bottom'); } catch {}
  applyPanes();
};
try { if (localStorage.getItem('tonnetz.dock') === 'right') { app.panes.ton.side = true; $('tside').textContent = 'Dock: right'; } } catch {}

function applyScale() {
  const sc = SCALE_OPTS[app.scaleIdx];
  $('scale').textContent = 'Scale: ' + (sc ? sc.name : 'free');
  $('root').textContent = 'Root: ' + ROOT_NAMES[app.scaleRoot];
  $('root').style.display = sc ? '' : 'none';
  app.harmony.setLock(app.scaleRoot, sc && sc.iv);
}
$('scale').onclick = () => { app.scaleIdx = (app.scaleIdx + 1) % SCALE_OPTS.length; applyScale(); };
$('root').onclick = () => { app.scaleRoot = (app.scaleRoot + 1) % 12; applyScale(); };
applyScale();
$('len').onclick = () => {
  if (!app.player) return;
  const seq = app.player.seq;
  seq.chordBars = LEN_OPTS[(LEN_OPTS.indexOf(seq.chordBars) + 1) % LEN_OPTS.length];
  $('len').textContent = `Chord: ${seq.chordBars} bar${seq.chordBars > 1 ? 's' : ''}`;
};
setOctave(app.harmony.octave);
$('bpmv').textContent = '116 bpm';

const MODULE_ORDER = ['fmp', 'fm', 'dist', 'vco', 'vcf', 'pad', 'delay', 'reverb'];
for (const type of MODULE_ORDER) {
  const row = document.createElement('div'), dot = document.createElement('i'), name = document.createElement('span');
  row.className = 'prow'; dot.className = 'swatch'; dot.style.background = TYPES[type].color;
  name.textContent = TYPES[type].name;
  row.append(dot, name);
  row.onclick = () => {
    $('modpanel').hidden = true;
    if (!app.ctx) return;
    const at = toWorld({ x: app.LW * (0.15 + Math.random() * 0.4), y: app.tableH * (0.25 + Math.random() * 0.5) });
    addModule(type, at.x, at.y);
  };
  $('modlist').append(row);
}
$('modbtn').onclick = () => { $('modpanel').hidden = !$('modpanel').hidden; };
document.addEventListener('pointerdown', e => { if (!$('mod').contains(e.target)) $('modpanel').hidden = true; });

/* ---------- drawing ---------- */

/* Everything that never changes between frames is painted once; phones can't repaint the lattice at 60 fps. */

function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  if (now - app.lastFrame < 30) return;
  app.lastFrame = now;
  if (app.layoutDirty) { app.layoutDirty = false; relayout(); }
  app.g.setTransform(app.DPR, 0, 0, app.DPR, 0, 0);
  app.g.drawImage(app.cache, 0, 0, app.W, app.H);
  if (!app.ctx) return;

  const q = app.player.seq.stepQueue;
  while (q.length && q[0].t <= app.ctx.currentTime) {
    const e = q.shift();
    app.curStep = e.k;
    if (e.note) {
      app.pulse = 1;
      const t0 = now - (app.ctx.currentTime - e.t) * 1000;
      app.trail.push({ midi: e.midi, t0, t1: t0 + e.dur * 1000 });
    }
  }
  while (app.trail.length && app.trail[0].t1 !== null && now - app.trail[0].t1 > 1000) app.trail.shift();
  app.pulse *= 0.92;

  for (const m of app.mods) analyse(m);
  app.g.save();
  app.g.beginPath(); app.g.rect(0, 0, app.LW, app.tableH); app.g.clip();
  app.g.translate(app.view.x, app.view.y); app.g.scale(app.view.z, app.view.z);
  drawGrid();
  for (const m of app.mods) if (m.target) drawCable(m);
  drawMaster(now);
  for (const m of app.mods) {
    const touched = new Set();
    for (const s of app.ptr.values()) if (s.kind === 'ring' && s.m === m) touched.add(s.key);
    drawModule(m, touched, now);
  }
  app.g.restore();
  app.g.fillStyle = 'rgba(216,222,240,0.5)';
  app.g.font = `${Math.round(U * 0.3)}px system-ui, sans-serif`;
  app.g.textAlign = 'center'; app.g.textBaseline = 'bottom';
  app.g.fillText(statusText(), app.LW / 2, 34);
  drawStrip();
  if (app.panes.seq.show) drawSeq();
  if (app.panes.arp.show) drawArp();
  if (app.panes.keys.show) drawKeys(now);
  if (app.panes.ton.show) drawTonnetz(now);
  for (const s of app.ptr.values()) {
    if (s.kind !== 'split') continue;
    app.g.fillStyle = 'rgba(255,255,255,0.14)';
    app.g.fillRect(0, s.pane.split, app.LW, SPL);
  }
}

/* ---------- persistence ---------- */

const store = createStore({
  storage: localStorage, capture: captureState, apply: applyState, ready: () => !!app.player, onChange: renderPresets,
  stock: () => stockPresets({ x0: 0, x1: app.master.x - U * 3.2, y: app.master.y }),
});
app.store = store;

/* One snapshot serves the autosaved session and every preset: rack (parameters, wiring, positions), table view, sequencer, scale lock. */
function captureState() {
  return {
    v: 2,
    mods: app.rack.serialize(), master: { x: app.master.x, y: app.master.y }, view: { ...app.view },
    seq: app.player.seq.getState(), scale: { idx: app.scaleIdx, root: app.scaleRoot }, octave: app.harmony.octave,
    song: app.harmony.song ? app.harmony.song.chords : null,
  };
}

function syncSeqUi() {
  const seq = app.player.seq;
  syncStyle();
  $('engine').textContent = 'Engine: ' + (seq.mode === 'arp' ? 'arp' : 'steps');
  $('len').textContent = `Chord: ${seq.chordBars} bar${seq.chordBars > 1 ? 's' : ''}`;
  $('bpmv').textContent = seq.bpm + ' bpm';
}

/* Stored data may come from another version or be corrupt, so each part is validated on its own and bad parts are skipped. */
function applyState(st) {
  if (!st || st.v !== 2 || !Array.isArray(st.mods)) return false;
  app.selected = null;
  app.rack.clear();
  if (st.mods.length && !app.rack.restore(st.mods)) return false;
  const M = st.master, V = st.view, S = st.scale;
  if (M && Number.isFinite(M.x) && Number.isFinite(M.y)) { app.master.x = M.x; app.master.y = M.y; }
  if (V && [V.z, V.x, V.y].every(Number.isFinite)) { app.view.z = clamp(V.z, Z_MIN, Z_MAX); app.view.x = V.x; app.view.y = V.y; }
  else if (st.fit) fitView();
  app.player.seq.setState(st.seq);
  const song = Array.isArray(st.song) && st.song.length <= 128 && st.song.every(id => Number.isInteger(id) && id >= 0 && id < 24);
  app.harmony.setSong(song ? st.song : null);
  if (S && Number.isInteger(S.idx) && S.idx >= 0 && S.idx < SCALE_OPTS.length && Number.isInteger(S.root)) {
    app.scaleIdx = S.idx; app.scaleRoot = mod12(S.root);
    applyScale();
  }
  if (Number.isFinite(st.octave)) setOctave(st.octave);
  syncSeqUi();
  syncButtons();
  if (app.player.seq.running) app.rack.padsSet(app.harmony.padVoicing());
  return true;
}

function renderPresets() {
  const list = $('prelist'), { presets, current: curPreset } = store, cur = presets[curPreset];
  list.replaceChildren();
  presets.forEach((p, i) => {
    if (!p) return;
    const row = document.createElement('div');
    row.className = 'prow' + (i === curPreset ? ' cur' : '');
    const num = document.createElement('b'), name = document.createElement('span');
    num.textContent = String(i + 1).padStart(3, '0'); name.textContent = p.name;
    row.append(num, name);
    row.onclick = () => store.loadProgram(i);
    list.append(row);
  });
  if (!list.children.length) {
    const none = document.createElement('div');
    none.className = 'pempty'; none.textContent = 'No presets yet: name one below and Save.';
    list.append(none);
  }
  $('prebtn').textContent = 'Preset: ' + (cur ? cur.name : '-') + ' ▾';
  if (cur) $('prename').value = cur.name;
}

$('prebtn').onclick = () => { $('prepanel').hidden = !$('prepanel').hidden; };
$('presave').onclick = () => { if (app.player) store.savePreset($('prename').value); };
$('predel').onclick = () => store.deletePreset();
document.addEventListener('pointerdown', e => { if (!$('pre').contains(e.target)) $('prepanel').hidden = true; });

/* ---------- start ---------- */

function start() {
  app.ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
  app.rack = new Rack(app.ctx);
  app.mods = app.rack.mods;
  app.master = app.rack.master;
  app.player = new Player(app.harmony, app.rack);
  app.master.x = app.LW / app.view.z - U * 2.6;
  app.master.y = app.tableH / app.view.z / 2;
  store.loadPresets();
  renderPresets();

  if (!store.restoreSession()) {
    const types = ['vco', 'vcf', 'fmp', 'dist', 'delay'], usable = app.master.x - U * 3.2;
    const [vco, vcf, piano, dist, delay] = types.map((type, k) => addModule(type, usable * (k + 0.5) / types.length, app.master.y));
    app.rack.connect(vco, vcf); app.rack.connect(vcf, dist); app.rack.connect(piano, dist); app.rack.connect(dist, delay); app.rack.connect(delay, app.master);
  }
  store.markSaved();
  setInterval(store.saveSession, 1000);
  setInterval(store.autosavePreset, 30000);
  addEventListener('pagehide', store.saveSession);

  app.player.start();
  app.ctx.resume();
  $('start').remove();
}

$('start').addEventListener('click', start, { once: true });
addEventListener('resize', resize);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data !== 'updated' || $('upd')) return;
    const b = document.createElement('button');
    b.id = 'upd'; b.textContent = 'New version ready: tap to reload';
    b.style.cssText = 'position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;border-color:#7dffb0';
    b.onclick = () => location.reload();
    document.body.append(b);
  });
}
try { indexedDB.deleteDatabase('tonnetz'); } catch (e) { /* older versions stored a pattern and a song there; both features are gone */ }
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
